<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>HiChord</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>HiChord</h1>
      <div class="control-group" aria-label="Key">
        <button type="button" class="pill-btn" data-action="key-prev" aria-label="Previous key">&larr;</button>
        <div class="display">
          <span class="display-label">Key</span>
          <span class="display-value" data-display="key">C</span>
        </div>
        <button type="button" class="pill-btn" data-action="key-next" aria-label="Next key">&rarr;</button>
      </div>
      <div class="control-group" aria-label="Voice">
        <button type="button" class="pill-btn" data-action="voice-prev" aria-label="Previous voice">&darr;</button>
        <div class="display">
          <span class="display-label">Voice</span>
          <span class="display-value" data-display="voice">Soft Pad</span>
        </div>
        <button type="button" class="pill-btn" data-action="voice-next" aria-label="Next voice">&uarr;</button>
      </div>
    </header>

    <main class="stage">
      <section class="panel" aria-label="Chord buttons">
        <h2 class="panel-title">Chords <span class="hint">hold JIKOLP;</span></h2>
        <div class="chord-keyboard">
          <!-- Staggered to mirror real keyboard geometry: I/O/P sit above K/L/; -->
          <button type="button" class="chord-btn" style="grid-column: 1 / 3; grid-row: 1;" data-base="KeyJ">
            <span class="key-letter">J</span><span class="degree">I</span><span class="chord-name">C</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 3 / 5; grid-row: 2;" data-base="KeyI">
            <span class="key-letter">I</span><span class="degree">ii</span><span class="chord-name">Dm</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 3 / 5; grid-row: 1;" data-base="KeyK">
            <span class="key-letter">K</span><span class="degree">iii</span><span class="chord-name">Em</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 5 / 7; grid-row: 2;" data-base="KeyO">
            <span class="key-letter">O</span><span class="degree">IV</span><span class="chord-name">F</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 5 / 7; grid-row: 1;" data-base="KeyL">
            <span class="key-letter">L</span><span class="degree">V</span><span class="chord-name">G</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 7 / 9; grid-row: 2;" data-base="KeyP">
            <span class="key-letter">P</span><span class="degree">vi</span><span class="chord-name">Am</span>
          </button>
          <button type="button" class="chord-btn" style="grid-column: 7 / 9; grid-row: 1;" data-base="Semicolon">
            <span class="key-letter">;</span><span class="degree">vii°</span><span class="chord-name">B°</span>
          </button>
        </div>
      </section>

      <section class="panel" aria-label="Chord variants">
        <h2 class="panel-title">Variants <span class="hint">hold QWE / ASD / ZXC</span></h2>
        <div class="variant-grid">
          <button type="button" class="variant-btn" data-variant="KeyQ"><span class="key-letter">Q</span><span class="variant-name">aug</span></button>
          <button type="button" class="variant-btn" data-variant="KeyW"><span class="key-letter">W</span><span class="variant-name">Mm flip</span></button>
          <button type="button" class="variant-btn" data-variant="KeyE"><span class="key-letter">E</span><span class="variant-name">dom7</span></button>
          <button type="button" class="variant-btn" data-variant="KeyA"><span class="key-letter">A</span><span class="variant-name">dim</span></button>
          <button type="button" class="variant-btn" data-variant="KeyS"><span class="key-letter">S</span><span class="variant-name">neutral</span></button>
          <button type="button" class="variant-btn" data-variant="KeyD"><span class="key-letter">D</span><span class="variant-name">M7</span></button>
          <button type="button" class="variant-btn" data-variant="KeyZ"><span class="key-letter">Z</span><span class="variant-name">6sus2</span></button>
          <button type="button" class="variant-btn" data-variant="KeyX"><span class="key-letter">X</span><span class="variant-name">sus4</span></button>
          <button type="button" class="variant-btn" data-variant="KeyC"><span class="key-letter">C</span><span class="variant-name">9</span></button>
        </div>
      </section>
    </main>

    <footer class="loopbar">
      <button type="button" class="record-btn" data-action="record">
        <span class="rec-dot"></span>
        <span>Hold Tab / press to record loop</span>
      </button>
      <div class="display">
        <span class="display-label">Loop</span>
        <span class="display-value" data-display="loop">No loop</span>
      </div>
      <button type="button" class="pill-btn" data-action="clear-loop">Clear loop</button>
    </footer>

    <p class="footnote">
      Desktop: keyboard as above, arrows to change key/voice, Tab to loop.
      Mobile/no keyboard: use the on-screen buttons for everything.
    </p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
